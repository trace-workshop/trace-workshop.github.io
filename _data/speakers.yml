# Keynote speakers and panelists. Only list people who have CONFIRMED.
# Keep them in alphabetical order by LAST name (the pages show them in this order).
# img: a photo in img/; leave empty for the placeholder.
# status: the role shown under the name (for example "Keynote (Academic)" or "Panelist").

slim:
  name: "Ser-Nam Lim"
  url: "https://www.cs.ucf.edu/person/ser-nam-lim/"
  affiliation: "University of Central Florida"
  img: "slim.jpg"
  bio: "Ser-Nam Lim is an Associate Professor of Computer Science at the University of Central Florida and a member of the UCF AI Initiative. Research interests cover computer vision and multimodal AI, including generative AI. From 2018 to 2023, Ser-Nam managed multiple AI teams at Meta working on computer vision, NLP, and other areas, including understanding user-uploaded images and videos for platform safety. Ser-Nam holds a PhD in computer science from the University of Maryland, College Park."
  status: "Panelist"

yliu:
  name: "Yan Liu"
  url: "https://sites.google.com/view/yanliu-ai/home"
  affiliation: "University of Southern California"
  img: "yliu.jpg"
  bio: "Yan Liu is a Professor and the Fletcher Jones Foundation Endowed Chair of Computer Science at the University of Southern California, where she directs the USC Machine Learning Center and co-directs the USC Institute on Ethics and Trust in Computing. Her research covers machine learning for time series, physics-informed machine learning, and interpretable machine learning. She is a Fellow of IEEE and AAAI and was general chair of ICLR 2023 and ACM KDD 2020."
  status: "Keynote (Academic)"

fshihab:
  name: "Ibne Farabi Shihab"
  url: "https://farabi1038.github.io/"
  affiliation: "Amazon"
  img: "fshihab.jpg"
  bio: "Ibne Farabi Shihab is an Applied Scientist II at Amazon in Sunnyvale, working on agentic bot systems, and holds a PhD in computer science from Iowa State University. His recent work on the reliability of LLM systems, including risk certification of LLM outputs, retrieval-anchored decoding for faithful RAG, and stress-testing of process reward models, appears at NeurIPS, ICML, ACL, and EMNLP, and he serves as an area chair for ACL Rolling Review."
  status: "Keynote (Industry)"

