<figure class="tc" aria-label="How the Failure Clinic works">
  <figcaption class="sr-only">Before the workshop, participants contribute failure traces. During the workshop, small groups, each led by an organizer or program committee member, classify the traces against a draft taxonomy, then revise the taxonomy and find failures that current metrics miss. After the workshop, the outputs are a shared failure taxonomy and a list of open evaluation problems, summarized in a report to SIGIR Forum.</figcaption>
  <div class="tc-phases" aria-hidden="true">
    <span class="before">BEFORE THE WORKSHOP</span>
    <span class="during">DURING THE WORKSHOP</span>
    <span class="after">AFTER</span>
  </div>
  <ol class="tc-steps" aria-hidden="true">
    <li class="tc-step" data-phase="BEFORE THE WORKSHOP">
      <span class="tc-num">1</span>
      <svg class="tc-icon" width="30" height="34" viewBox="0 0 30 34" aria-hidden="true" fill="none" stroke="#2A6F97" stroke-width="1.6"><rect x="7" y="1" width="22" height="28" rx="2"/><rect x="1" y="5" width="22" height="28" rx="2" fill="#fff"/><path d="M6 13 H18 M6 19 H18 M6 25 H13"/></svg>
      <strong>Contribute failure traces</strong>
      <span class="tc-desc">Input, retrieval and reasoning trace, and the wrong outcome</span>
    </li>
    <li class="tc-step" data-phase="DURING THE WORKSHOP">
      <span class="tc-num">2</span>
      <svg class="tc-icon" width="36" height="34" viewBox="0 0 36 34" aria-hidden="true" fill="none" stroke="#2A6F97" stroke-width="1.6"><circle cx="9" cy="7" r="5"/><circle cx="27" cy="7" r="5"/><circle cx="18" cy="11" r="5" fill="#fff"/><path d="M1 28 a8 8 0 0 1 16 0 M19 28 a8 8 0 0 1 16 0"/><path d="M9 32 a9 9 0 0 1 18 0" fill="#fff"/></svg>
      <strong>Classify in small groups</strong>
      <span class="tc-desc">Each group led by an organizer or program committee member</span>
    </li>
    <li class="tc-step">
      <span class="tc-num">3</span>
      <svg class="tc-icon" width="30" height="34" viewBox="0 0 30 34" aria-hidden="true" fill="none" stroke="#2A6F97" stroke-width="1.6"><circle cx="15" cy="5" r="4"/><circle cx="4" cy="29" r="4"/><circle cx="15" cy="29" r="4"/><circle cx="26" cy="29" r="4"/><path d="M15 9 V17 M4 25 V17 H26 V25 M15 17 V25"/></svg>
      <strong>Revise the taxonomy</strong>
      <span class="tc-desc">and find failures that current metrics miss</span>
    </li>
    <li class="tc-step tc-out" data-phase="AFTER">

</figure>
